# 复制为 config.toml 后使用；config.toml、stron_token、data、logs 均不提交 Git。
# 相对路径以本配置文件所在目录为基准。所有时间单位为秒，日期时间采用指定时区。

[app]
# 按顺序执行的平台；当前支持 mercado 和 shopee，未实现的平台打印跳过日志。
platforms = ["mercado", "shopee"]
# Cookie、浏览器 profile、sessionStorage 的根目录；首次运行自动创建。
session_dir = "stron_token"
# 每次运行的 JSON 输出目录；文件以运行时间命名，latest.json 为最近一次结果。
output_dir = "data"
# 轮转日志目录；同时打印到控制台，不记录密钥和 Cookie。
log_dir = "logs"
# 日志等级，可选 DEBUG、INFO、WARNING、ERROR；INFO 包含每个命中商品的 JSON。
log_level = "INFO"

[schedule]
# 常驻模式的每日执行时刻，24 小时制 HH:MM；修改后重启程序生效。
daily_time = "09:00"
# IANA 时区；Windows 由 tzdata 提供，默认中国标准时间。
timezone = "Asia/Shanghai"
# 常驻启动时是否先执行一次（当日已有定时执行记录则不重复）；false 等待下次时刻。
run_on_start = false
# 常驻检查周期；也用于响应 Ctrl+C，越小检查越频繁。
poll_seconds = 15

[feishu]
# 飞书企业自建应用 App ID；环境变量 FEISHU_APP_ID 优先于这里的值。
app_id = ""
# 飞书企业自建应用 App Secret；环境变量 FEISHU_APP_SECRET 优先，切勿提交到 Git。
app_secret = ""
# 多维表 app_token，即 /base/ 后的 token；不是 tenant_access_token 或 Wiki token。
# 环境变量 FEISHU_APP_TOKEN 优先。
app_token = ""
# 数据表 table_id，通常为 tbl 开头，从链接 table 参数获得；环境变量 FEISHU_TABLE_ID 优先。
table_id = ""
# 可选视图 ID；空字符串读取全表，有值时仅读取该视图的记录。
view_id = ""
# 飞书 HTTP 连接和读取超时；超时后按 retries 重试。
timeout_seconds = 30
# 网络错误、429、5xx 最大额外重试次数；权限/参数错误立即失败。
retries = 3
# 指数退避的初始间隔；第 n 次重试等待此值乘以 2 的 n 次方。
retry_seconds = 2
# 每页读取记录数，飞书上限为 500；程序自动读取所有 page_token。
page_size = 500

[feishu.fields]
# 平台字段名称；匹配 mercado 时忽略大小写和两端空格。
platform = "平台"
# 商品唯一标识字段名称；保留完整字符串，Mercado ID 统一为大写。
product_id = "商品ID"
# 监控字段名称；只有单一文本值“开启”进入采集，true/1/其他选项不算开启。
monitor = "监控开关"
# 数据接收人字段名称；此字段非空才进入监控，保留人员 ID 供未来消息模块使用。
recipients = "数据推送人"
# 推送字段名称（截图为“推送开关”）；当前仅记录，关闭不影响抓取，未来发送模块使用。
push = "推送开关"
# 任务表中运营填写的自定义名称；显示在消息商品 ID 旁，不覆盖平台抓取的完整标题。
name = "自定义-商品名"
# 原监控表的竞品标记字段；写入结果表“竞品”，不影响监控筛选。
competitor = "是否竞品"
# 原监控表的负责人字段；用于结果表负责人，不以数据推送人替代。
owner = "负责人"

[browser]
# Chrome/Edge 可执行文件路径；空值由 DrissionPage 自动发现。
executable = ""
# 此项目专用调试端口；必须未被其他浏览器占用，禁止接管日常浏览器。
port = 9333
# 是否无头运行；首次登录必须 false，定时运行也建议 false 以便重新登录。
headless = false
# DOM 元素出现的最长等待时间。
element_timeout_seconds = 30
# 文档加载的最长等待时间。
page_load_timeout_seconds = 60
# 每轮结束关闭项目专用浏览器，确保 profile 正常落盘；常驻下轮重新加载会话。
close_after_run = true

[mercado]
# 蓝鲸收藏页地址；优先在此查找飞书中需要监控的商品。
favorite_url = "https://xp.lingdongsz.com/#/favorite"
# 蓝鲸登录页地址；通过 URL fragment 判断是否需要手动登录。
login_url = "https://xp.lingdongsz.com/#/login"
# 手动登录成功的目标地址；检测到 /home 后再进入收藏页。
home_url = "https://xp.lingdongsz.com/#/home"
# 收藏页找不到商品时使用的搜索页地址。
search_url = "https://xp.lingdongsz.com/#/searchItems"
# 每次路由导航在文档加载完成后固定等待；按当前要求默认 10 秒。
page_wait_seconds = 10
# 等待人工登录最长时间；默认 5 分钟。
manual_login_timeout_seconds = 300
# 手动登录成功、检测到 /home 后的独立稳定等待，再跳转收藏页；可设 3～5 秒对照测试，0 表示禁用。
login_settle_seconds = 5
# 登录状态与异步结果的轮询间隔。
poll_seconds = 1
# 翻页或搜索结果变化后的额外稳定等待，防止拿到上一批商品。
result_settle_seconds = 2
# 虚拟表格滚动后等待 DOM、图片和 Canvas 重绘的时间。
scroll_wait_seconds = 0.4
# 单次滚动占可见宽度/高度的比例；小于 1 保留重叠，防止漏行和漏列。
scroll_fraction = 0.75
# 单页最多滚动采样次数，超限报告错误，不把未扫描商品误判为不存在。
max_scroll_steps = 2000
# 最大分页次数，防止异常页面无限翻页；达到上限仍有下一页则报告错误。
max_pages = 1000
# 点击加入收藏后等待弹窗的固定时间，按要求为 2 秒。
favorite_dialog_wait_seconds = 2
# 搜索命中商品加入的收藏组；该分组必须已在蓝鲸中创建。
favorite_group = "每日查询分组"

[mercado.selectors]
# 登录按钮 XPath；修正请求中重复粘贴造成的引号/括号错误。
login_button = '//span[contains(@class,"layout-navbars-breadcrumb-user-link")][.//span[normalize-space(.)="注册/登录"]]'
# 搜索商品 ID 输入框 XPath。
search_input = '//div[@class="search-bar"]//input[contains(@placeholder,"商品ID")]'
# 搜索查询按钮 XPath。
search_button = '//div[@class="search-bar"]//button[contains(normalize-space(.),"查询")]'
# Element Plus 的下一页按钮 CSS；同时检查 disabled、aria-disabled 和当前页变化。
next_button = '.el-pagination .btn-next'
# 收藏弹窗分组选择输入框 XPath；只在弹窗出现后寻找。
group_input = '//input[contains(@placeholder,"请选择分组")]'
# 收藏弹窗确认按钮 XPath。
group_confirm = '//div[contains(concat(" ",normalize-space(@class)," ")," el-message-box ")]//button[normalize-space(.)="确认"]'

[feishu_output]
# 是否在 once/serve 采集后自动写入结果表；启用前填写下面的目标表标识。
enabled = false
# 当前结果表所属平台；本表按该平台+商品ID匹配，其他平台应使用独立的表适配配置。
platform = "mercado"
# 写入目标多维表 app_token，与 [feishu] 读取源的 app_token 分开；勿填写 Wiki token。
app_token = ""
# 写入目标数据表 table_id；按全表查重，不受链接 view 参数过滤。
table_id = ""
# 每批创建/更新记录数，取值 1～500；创建请求持久保存 client_token 以支持幂等重试。
batch_size = 100

[feishu_output.fields]
# 以下为“程序字段 = 飞书目标列名”；空字符串表示不写该列，product_id 不可为空。
# 唯一匹配列；目标表无 ID 的行不按名称猜测匹配。
product_id = "商品ID"
# 平台实际完整标题，不使用运营自定义商品名覆盖。
name = "商品标题"
# 从原监控表读取的是否竞品，目标为单选字段。
competitor = "竞品"
# 从原监控表读取的负责人，目标为人员字段；多负责人冲突时保留已有值并报告。
owners = "负责人"
# 商品当地币价格，货币为巴西雷亚尔 BRL。
price_brl = "价格-BRL"
# 商品人民币价格，对应采集 JSON 的 prices.CNY。
price_cny = "价格-RMB"
# 商品总销量，数字字段。
sales_total = "总销量"
# 近 7 天销量，数字字段。
sales_7d = "销量-7天"
# 近 30 天销量，数字字段。
sales_30d = "销量-30天"
# 近 60 天销量，数字字段。
sales_60d = "销量-60天"
# 近 90 天销量，数字字段。
sales_90d = "销量-90天"
# 网页显示的近 30 天 BRL 销售额，不按当前价格重新计算。
revenue_30d_brl = "销售额-近30天"
# 7 天销量环比；文本字段写入如 -69.50%，数字百分比字段则按百分比格式换算。
growth_7d = "销量变化-7天环比"
# 30 天销量环比；规则同上。
growth_30d = "销量变化-30天环比"
# 蓝鲸转化率；目标表实际名称为“转换率”，保留用户命名。
conversion = "转换率"
# 评论数量，0 仍写入；未知值跳过，不清空现有值。
review_count = "评论数"
# 平台评分；保留来源数值，0 评论时的 0 分不代表差评。
rating = "评分"
# 品牌名称，从 brand_and_seller 三项结构中取第一项。
brand = "品牌"
# 卖家名称，从 brand_and_seller 中取第二项。
seller = "卖家名称"
# 店铺类型，从 brand_and_seller 中取第三项，例如本土店。
shop_type = "店铺类型"
# BSR 排名；当前 --/null 不写入，不以 0 替代。
bsr = "bsr"
# 商品地址，目标为超链接字段。
url = "商品链接"
# 首张商品图片地址，目标为超链接字段；不上传附件。
image_url = "商品图片链接"
# 完整类目路径，以 > 分隔，目标为文本字段。
categories = "类目路径"
# 本次写入飞书的时间，目标为日期字段；每次成功同步均刷新，包含商品指标未变化的情况。
# 不是商品采集时间或蓝鲸数据日期；设为空字符串可关闭此列写入。
updated_at = "更新日期"

[feishu_sheets]
# 是否在 once/serve 每次采集后追加二维表历史；与多维结果表开关独立，示例默认关闭。
enabled = false
# 本二维历史表对应的平台；只记录该平台，避免将不同币种结构混入本工作表。
platform = "mercado"
# 二维表链接 /sheets/ 后的文档 token，不是多维表 app_token；复用 [feishu] 应用凭据。
spreadsheet_token = ""
# 文档内工作表的 sheet_id，不是工作表标题；由 sheets/query API 获得。
sheet_id = ""
# 第一行数据的行号（从 1 开始）；当前表有两行合并表头，因此为 3。
data_start_row = 3
# 写入前核对 A:Y 表头及列顺序，支持现有两层合并表头；避免列被移动后写错位置。
validate_headers = true
# 单次追加的商品行数，1～1000；每批固定写入范围并持久保存，便于异常后核对恢复。
batch_size = 100
# 扫描 A 列的分段行数，1～5000；取最后非空行之后追加，不填补历史中间空洞。
scan_chunk_rows = 2000
# 空行不足时在表末尾增加的行数，1～5000；不插入到已有数据之间。
grow_rows = 500

[feishu_messages]
# 允许推送的平台；Shopee 当前只采集 JSON，因此暂时仅配置 mercado。
platforms = ["mercado"]
# 是否在 once/serve 采集后发送飞书商品卡片；复用 [feishu] 应用机器人，示例默认关闭。
# 发送前重新读取 [feishu] 任务表，只有监控/推送开关均为“开启”才发送给该记录的数据推送人。
enabled = false
# 每张卡片最多容纳的商品数，1～4；按数据推送人汇总，多人字段逐人发送，不发给负责人。
products_per_message = 4
# 卡片“数据链接”的完整 URL，指向最新数据多维表；留空则不显示该链接。
data_url = ""
# 卡片“历史链接”的完整 URL，指向二维历史表；留空则不显示该链接。
history_url = ""

[shopee]
# Shopdora 首页；浏览器先访问此地址并检查是否已登录。
home_url = "https://www.shopdora.com/"
# 未登录时打开的密码登录页。
login_url = "https://www.shopdora.com/login"
# Shopdora 手机号或子账号；环境变量 SHOPDORA_USERNAME 优先，示例不包含真实账号。
username = ""
# Shopdora 登录密码；环境变量 SHOPDORA_PASSWORD 优先，仅放本地配置，不提交 Git。
password = ""
# 本阶段只支持巴西 br；同时核验筛选区的巴西单选框，不能以顶部全局站点代替。
site = "br"
# 导航后额外等待页面组件挂载的时间。
page_wait_seconds = 2
# 自动提交密码后等待登录完成的时间；出现验证码时可在可见浏览器中手动完成。
login_timeout_seconds = 300
# 登录成功后等待会话稳定，再打开产品菜单。
login_settle_seconds = 3
# 查询或翻页请求、结果渲染的最长等待时间。
result_timeout_seconds = 60
# DOM、登录和查询状态的轮询间隔。
poll_seconds = 0.5
# 查询结束后额外等待表格及趋势图渲染的时间。
result_settle_seconds = 2
# 收藏分页安全上限；超限或翻页不前进时报错，避免把漏扫误判成未收藏。
max_pages = 1000

[shopee.selectors]
# 登录表单账号输入框 CSS。
username = 'form.login-form input[placeholder="手机号/子账号"]'
# 登录表单密码输入框 CSS，兼容明文显示与密码掩码模式。
password = 'form.login-form input[placeholder="请输入登录密码"]'
# 密码登录提交按钮 CSS。
login_submit = 'form.login-form button[type="submit"]'
# 已登录用户区域 CSS；同时检查其中不是“登录/注册”提示。
logged_in = '.user-info'
# Header 产品菜单 XPath，通过悬停打开子菜单。
product_menu = '//div[contains(@class,"serviceMain")]//span[normalize-space(.)="产品"]'
# Header 我的收藏入口 XPath。
favorites_menu = '//div[contains(@class,"serviceAll")]//div[contains(@class,"text") and normalize-space(.)="我的收藏"]'
# Header 选产品入口 XPath。
search_menu = '//div[contains(@class,"serviceAll")]//div[contains(@class,"text") and normalize-space(.)="选产品"]'
# 当前页面筛选区域 CSS，排除隐藏弹窗和 Header 全局站点。
filters = '.filter-containter'
# 筛选区巴西站点单选框的标签 CSS。
brazil = '.filter-containter label.t-radio-button:has(input[value="br"])'
# 收藏页产品输入框 CSS，查询全收藏前清空。
favorite_input = '.filter-containter input[placeholder="请输入产品名、链接或ID搜索"]'
# 选产品页产品 ID 专用输入框 CSS。
search_input = '.filter-containter .t-form-item__itemIdOrUrl input'
# 筛选区查询按钮 CSS。
query = '.filter-containter button.confirm'
# 筛选区重置按钮 CSS；清除上轮残留的类目、日期、价格等条件。
reset = '.filter-containter button.reset'
# 结果区 CSS，仅提取商品表格，避免保存账号、登录表单等无关数据。
results = '.result-containter'
# 产品主行 CSS；同商品的补充信息位于紧随其后的 row-sub 行。
rows = '.custom-table tr.row-main'
# 分页下一页按钮 CSS；检查禁用状态和结果 ID 更新。
next_button = '.result-containter .t-pagination__btn-next'
